[project]
name = "ore-project"
version = "0.1.0"
description = "Allocation algorithm analysis, cost optimisation and predictive modelling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Data
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=16.0",       # parquet caching
    "ijson>=3.3",          # streaming JSON parser

    # Notebooks
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",

    # Modelling
    "scikit-learn>=1.5",
    "lightgbm>=4.4",
    "shap>=0.46",
    "optuna>=3.6",

    # Visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",

    # Utilities
    "tqdm>=4.66",
    "scipy>=1.14",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ipywidgets>=8.1",
]
